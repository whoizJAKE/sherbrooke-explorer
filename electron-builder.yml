appId: com.jacobhm.sherbrookeexplorer
productName: Sherbrooke Explorer
directories:
  output: release
files:
  - dist/**
  - electron/**
  - package.json
  - "!src/**"
asar: true
mac:
  category: public.app-category.games
  icon: build/icon.icns
  identity: null
  hardenedRuntime: true
  gatekeeperAssess: false
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
